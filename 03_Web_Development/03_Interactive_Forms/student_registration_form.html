<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Form Validation</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; padding: 30px; display: flex; justify-content: center; }
        .form-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 25px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: #8b949e; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #238636; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2ea043; }
        .error-msg { color: #f85149; font-size: 12px; margin-top: 4px; display: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="color: #f0f6fc; margin-top: 0;">Academic Enrollment Portal</h2>
        <form id="regForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Bhawesh Dewangan">
                <span class="error-msg" id="nameError">Please enter a valid name.</span>
            </div>
            <div class="form-group">
                <label for="email">Institutional Email</label>
                <input type="email" id="email" required placeholder="devangbhawesh07@gmail.com">
                <span class="error-msg" id="emailError">Please enter a valid email address.</span>
            </div>
            <button type="submit">Submit Registration</button>
        </form>
    </div>
    <script src="form_validation.js"></script>
</body>
</html>
